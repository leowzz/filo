[package]
name = "provider-opendal"
version.workspace = true
edition.workspace = true

[dependencies]
storage-domain.workspace = true
storage-provider-api.workspace = true
async-trait.workspace = true
uuid.workspace = true
tokio.workspace = true
serde_json.workspace = true
serde.workspace = true
hmac = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
quick-xml = { version = "0.39", features = ["serialize"] }
opendal = { version = "0.57", default-features = false, features = ["services-fs", "services-s3", "executors-tokio", "reqwest-rustls-tls", "layers-timeout"] }
tokio-util = { workspace = true, features = ["compat"] }
url = "2"
sha2.workspace = true
md-5 = "0.10"
futures = "0.3"
chrono = "0.4"
tempfile.workspace = true
open = "5"
aws-sdk-s3 = { version = "1.146.1", default-features = false, features = ["rt-tokio", "rustls", "default-https-client"] }
russh = { version = "0.63.3", default-features = false, features = ["async-trait", "ring", "rsa"] }
russh-sftp = "3.0"
smb2 = "0.22"
suppaftp = { version = "8.0.3", default-features = false, features = ["tokio-rustls-ring"] }
rustls-native-certs = "0.8"
rustls = { version = "0.23", default-features = false, features = ["logging", "std", "tls12", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
trash = "5"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile.workspace = true

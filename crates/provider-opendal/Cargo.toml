[package]
name = "provider-opendal"
version.workspace = true
edition.workspace = true

[dependencies]
storage-domain.workspace = true
storage-provider-api.workspace = true
async-trait.workspace = true
uuid.workspace = true
tokio.workspace = true
serde_json.workspace = true
opendal = { version = "0.57", default-features = false, features = ["services-fs", "services-s3", "executors-tokio", "reqwest-rustls-tls", "layers-timeout"] }
tokio-util = { workspace = true, features = ["compat"] }
url = "2"
sha2.workspace = true
md-5 = "0.10"
futures = "0.3"
chrono = "0.4"
tempfile.workspace = true
open = "5"

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
trash = "5"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile.workspace = true

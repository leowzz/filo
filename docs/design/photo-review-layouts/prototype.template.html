<style>

.lab{height:62px;display:flex;align-items:center;gap:24px;padding:0 20px;background:#25282c;border-bottom:1px solid #42464b;position:relative;z-index:5}.lab-brand{line-height:1.3}.lab-brand strong{font-size:14px;font-weight:600}.lab-brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.14em;margin-top:3px}.variants{display:flex;gap:5px}.variants button{padding:9px 13px;font-size:12px}.variants b{font:11px Consolas,monospace;margin-right:2px;color:var(--muted)}.variants button.active b{color:var(--accent)}.rec{font-size:9px;color:var(--green);padding-left:3px}.metrics{margin-left:auto;display:flex;align-items:center;gap:16px;white-space:nowrap}.metric strong{font-size:19px;font-weight:500;letter-spacing:-.04em;margin-right:4px}.metric small{font-size:10px;color:var(--muted)}.gain{font-size:12px;color:var(--green)}.lab .help-button{font-size:12px;padding:7px}.workspace{height:calc(100dvh - 62px);position:relative;display:grid;overflow:hidden;background:var(--bg)}.stage{grid-area:stage;min-width:0;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--bg)}.photo{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;user-select:none;-webkit-user-drag:none}.stage.zoom{overflow:auto;display:block}.stage.zoom .photo{max-width:none;max-height:none;width:auto;height:auto;margin:auto;cursor:grab}.stage.zoom.dragging .photo{cursor:grabbing}.empty{text-align:center;color:var(--muted);line-height:2}.empty strong{display:block;color:var(--text);font-size:20px;font-weight:500}.side{grid-area:side;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:16px;gap:18px;overflow:auto}.side-head{display:flex;align-items:center;justify-content:space-between;gap:6px}.wordmark{font-size:23px;font-weight:650;letter-spacing:-1.1px}.side-head .label{font-size:10px;letter-spacing:.12em}.file-info .filename{font-size:14px;margin:7px 0 4px;word-break:break-all}.file-info .path{font-size:11px;color:var(--muted)}.file-info .source{font-size:10px;color:var(--muted);margin-top:7px}.nav{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:6px;padding:3px}.nav .counter{color:var(--muted);font-size:11px}.nav .counter b{color:var(--text);font-size:15px;font-weight:500}.actions{display:flex;flex-direction:column;gap:10px}.stars{display:flex;justify-content:space-between;gap:1px}.stars button{padding:5px;min-height:32px;flex:1;color:#8b929b}.stars button svg{width:22px;height:22px}.stars button.filled{color:var(--accent)}.stars button.filled svg{fill:#a8c5ee45}.flags{display:flex;gap:6px}.flags button{flex:1;border-color:var(--line);height:38px;font-size:12px}.flags button.active.keep{color:var(--green);background:#b1cbb719;border-color:#b1cbb74a}.flags button.active.reject{color:var(--red);background:#deb2ac19;border-color:#deb2ac4a}kbd{font:10px Consolas,monospace;color:var(--muted);background:#ffffff08;border:1px solid #ffffff12;border-radius:3px;padding:0 4px;line-height:17px}.auto{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted);cursor:pointer}.auto input{width:27px;height:14px}.tools{display:flex;gap:3px;align-items:center}.tools button{flex:1;padding:6px;font-size:11px}.side-rule{height:1px;background:var(--line);flex-shrink:0}.library{min-height:0;display:flex;flex-direction:column;gap:9px;flex:1}.library-head{display:flex;align-items:center;justify-content:space-between;gap:4px;font-size:11px;color:var(--muted)}.library-head button{padding:3px}.film{grid-area:film;min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:#62686e transparent;display:flex;gap:8px}.side .film{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-content:start;gap:7px;flex:1}.thumb{border:1px solid transparent;border-radius:5px;padding:4px;position:relative;flex-shrink:0;min-width:0;overflo orm:translateX(-50%);display:flex;align-items:center;gap:18px;padding:9px 13px;border:1px solid #ffffff22;border-radius:12px;background:#202326ed;box-shadow:0 8px 32px #0005;backdrop-filter:blur(16px)}.floating-strip{position:absolute;z-index:2;bottom:98px;left:50%;transform:translateX(-50%);max-width:90%;background:#202326ed;padding:9px;border:1px solid var(--line);border-radius:10px}.floating-strip .thumb{width:86px}.floating-strip .thumb img{height:60px}.float-top,.float-dock{transition:opacity .25s}.idle .float-top,.idle .float-dock{opacity:0;pointer-events:none}.idle .float-top *{pointer-events:none}.floating-strip~.float-dock{opacity:1;pointer-events:auto}.left-wing{grid-area:film;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:9px 7px;gap:10px}.left-wing .film{flex-direction:column;flex:1}.left-wing .thumb{width:100%}.left-wing .thumb img{height:64px}.left-wing .label{text-align:center;font-size:10px}.left-wing .tools{justify-content:center}.variant-a{grid-template-columns:minmax(0,1fr) 236px;grid-template-areas:"stage side"}.variant-b{grid-template-rows:40px minmax(0,1fr) 128px;grid-template-areas:"top" "stage" "bottom"}.variant-b.no-film{grid-template-rows:40px minmax(0,1fr) 44px}.variant-c{grid-template-areas:"stage"}.variant-d{grid-template-columns:108px minmax(0,1fr) 180px;grid-template-areas:"film stage side"}.variant-d.no-film{grid-template-columns:minmax(0,1fr) 180px;grid-template-areas:"stage side"}.variant-d .side{padding:12px;gap:16px}.variant-d .flags{flex-direction:column}.variant-d .stars button{padding:3px}.variant-d .stars svg{width:21px}.variant-d .file-info .filename{font-size:12px}.variant-d .side-footer{margin-top:auto}.no-film .library,.no-film .bottom>.film,.no-film .left-wing{display:none}.no-film .side-footer{margin-top:auto}.zen{grid-template-columns:1fr!important;grid-template-rows:1fr!important;grid-template-areas:"stage"!important}.zen>:not(.stage){display:none!important}.zen-exit{display:none;position:fixed;right:12px;top:12px;z-index:9;background:#202326d9;border:1px solid #ffffff20;color:var(--muted);font-size:11px}.focus-mode .lab{display:none}.focus-mode .workspace{height:100dvh}.focus-mode .zen-exit{display:flex}.toast{position:fixed;z-index:20;left:50%;bottom:22px;transform:translate(-50%,15px);opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;padding:9px 16px;background:#34393ff2;border:1px solid #ffffff22;border-radius:7px;font-size:12px;box-shadow:0 6px 25px #0005}.toast.show{opacity:1;transform:translate(-50%,0)}dialog{color:var(--text);background:var(--panel);border:1px solid #4a4f55;border-radius:12px;padding:24px;box-shadow:0 25px 100px #0009;max-width:min(760px,calc(100vw - 36px));max-height:85dvh;overflow:auto}dialog::backdrop{background:#0009;backdrop-filter:blur(4px)}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:22px}.modal-head h2{font-weight:500;margin:0;font-size:22px;letter-spacing:-.02em}dialog p{color:var(--muted);line-height:1.9;font-size:12px;text-wrap:pretty}dialog table{border-collapse:collapse;width:100%;font-size:12px;margin:18px 0}td,th{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-weight:400}td:first-child{white-space:nowrap}dialog h3{font-size:13px;font-weight:500;margin:22px 0 8px}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 24px}.settings-grid label{display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--muted)}.modal-actions{display:flex;gap:8px;margin-top:22px}.primary{background:var(--blue);border-color:#a8c5ee55;color:var(--accent)}.upload{display:none}.badge{color:var(--accent);font-size:10px}.keylist{display:flex;flex-wrap:wrap;gap:10px 20px;color:var(--muted);font-size:12px}.errorbar{color:var(--red);padding:12px}.zoom-note{position:absolute;bottom:12px;left:12px;color:var(--muted);background:#202326cc;padding:5px 8px;border-radius:5px;font-size:10px;pointer-events:none}
.counter{white-space:nowrap}.float-dock{width:max-content;max-width:calc(100% - 24px)}.float-dock .nav{flex-shrink:0}
@media(min-width:1900px){.variant-a{grid-template-columns:minmax(0,1fr) 268px}.variant-d{grid-template-columns:124px minmax(0,1fr) 204px}.side{padding:20px}.side .thumb img{height:88px}}
@media(max-width:1100px){.lab{gap:12px;padding:0 12px}.variants button{padding:8px}.lab-brand small,.metrics .gain,.lab .help-button span,.rec{display:none}.metrics{gap:8px}.metric strong{font-size:16px}.variant-a{grid-template-columns:minmax(0,1fr) 210px}.variant-d{grid-template-columns:94px minmax(0,1fr) 168px}.side{padding:12px}}
@media(max-width:760px){.lab{height:94px;flex-wrap:wrap;align-content:center;gap:7px 12px}.lab-brand{display:none}.variants{order:2;flex-basis:100%;justify-content:space-between}.variants button{flex:1;padding:5px;font-size:11px}.metrics{margin-left:0;flex:1}.workspace{height:calc(100dvh - 94px)}.variant-a{grid-template-columns:minmax(0,1fr) 164px}.side{padding:10px;gap:12px}.side .flags{flex-direction:column}.side .thumb img{height:49px}.side .stars button{padding:2px}.side .stars svg{width:20px}.side .file-info .filename{font-size:11px}.variant-d{grid-template-columns:70px minmax(0,1fr) 150px}.variant-d .side{padding:8px}.variant-d.no-film{grid-template-columns:minmax(0,1fr) 150px}.left-wing .thumb img{height:46px}.bottom .actionline{gap:4px;padding:3px}.bottom .actions,.float-dock .actions{gap:4px}.bottom .nav,.float-dock .nav{gap:0}.bottom .flags button,.float-dock .flags button{min-width:0;padding:4px 6px}.bottom kbd,.float-dock kbd,.bottom .tools,.float-dock .tools{display:none}.float-dock{gap:2px;padding:7px;max-width:98%;bottom:16px}.float-dock .stars svg{width:18px}.float-dock .nav .counter{font-size:10px}.float-top{left:8px;right:8px;top:8px}.float-title{gap:5px}.float-title .muted{display:none}.float-tools{padding:5px;gap:2px}.topbar{gap:6px;padding:0 5px}.topbar .label,.topbar .mode-label{display:none}.settings-grid{grid-template-columns:1fr}dialog{padding:18px}.side-head .label{font-size:9px}.side-footer{flex-wrap:wrap}.side .tools button{font-size:10px;padding:4px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="lab"><div class="lab-brand"><strong>审图布局实验室</strong><small>FILO / LAYOUT STUDIES</small></div><nav class="variants" aria-label="布局方案"><button data-variant="a"><b>A</b>侧边工作台<span class="rec">推荐</span></button><button data-variant="b"><b>B</b>紧凑底片栏</button><button data-variant="c"><b>C</b>沉浸浮层</button><button data-variant="d"><b>D</b>双侧翼</button></nav><div class="metrics"><div class="metric"><strong id="coverage">—</strong><small>图片占屏</small></div><span class="gain" id="gain"></span></div><button class="help-button" data-action="about" title="方案说明与计算口径">方案说明</button><button class="help-button border" data-action="focus" title="隐藏方案导航，Esc 返回">体验<span>布局</span></button></header>
<main class="workspace variant-a" id="workspace" aria-label="审图交互原型"></main>
<button class="zen-exit" data-action="exit">返回方案 <kbd>Esc</kbd></button>
<div class="toast" role="status" aria-live="polite"></div>
<input id="upload" class="upload" type="file" accept="image/jpeg,image/png,image/webp,image/avif" multiple>
<dialog id="modal"></dialog>
<script>
const ASSETS=__ASSETS__;
const icons={left:'<path d="m14 5-7 7 7 7"/>',right:'<path d="m10 5 7 7-7 7"/>',star:'<path d="m12 3 2.8 5.7 6.3.9-4.5 4.4 1 6.2-5.6-3-5.6 3 1-6.2-4.5-4.4 6.3-.9Z"/>',flag:'<path d="M5 21V4c5-4 9 4 14 0v10c-5 4-9-4-14 0"/>',cross:'<path d="m6 6 12 12M18 6 6 18"/>',grid:'<rect x="3" y="4" width="7" height="6" rx="1"/><rect x="14" y="4" width="7" height="6" rx="1"/><rect x="3" y="14" width="7" height="6" rx="1"/><rect x="14" y="14" width="7" height="6" rx="1"/>',settings:'<path d="M4 7h6m4 0h6M4 17h10m4 0h2"/><circle cx="12" cy="7" r="2"/><circle cx="16" cy="17" r="2"/>',undo:'<path d="M8 5 3 10l5 5M3 10h11a6 6 0 0 1 0 12"/>',fit:'<path d="M3 9V3h6m6 0h6v6m0 6v6h-6m-6 0H3v-6"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',upload:'<path d="M12 16V3m-5 5 5-5 5 5M4 16v5h16v-5"/>',filter:'<path d="M3 5h18l-7 8v7l-4-2v-5Z"/>',check:'<path d="m5 12 4 4L19 6"/>'};
const svg=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[n]||icons.more}</svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let photos=ASSETS.map((src,i)=>({id:i,src,name:i===0?'DSC_7949.NEF':`截图样张 ${String(i+1).padStart(2,'0')}`,rating:0,flag:'',demo:true}));
let state={variant:'a',index:0,film:true,auto:false,zoom:false,filter:'all',sort:'asc',zen:false},history=[],timer,advanceTimer,toastTimer;
const workspace=document.querySelector('#workspace'),modal=document.querySelector('#modal');
const current=()=>photos[state.index];
function visible(){return photos.map((p,i)=>({p,i})).filter(({p})=>state.filter==='all'||state.filter==='unmarked'&&!p.flag||state.filter==='rated'&&p.rating>=3||p.flag===state.filter).sort((a,b)=>state.sort==='desc'?b.i-a.i:a.i-b.i)}
function btn(action,icon,title,extra=''){return `<button class="icon" data-action="${action}" title="${title}" aria-label="${title}" ${extra}>${svg(icon)}</button>`}
function nav(){let v=visible(),pos=v.findIndex(x=>x.i===state.index);return `<div class="nav">${btn('prev','left','上一张 ←',pos<=0?'disabled':'')}<span class="counter mono"><b>${pos+1}</b> / ${v.length}</span>${btn('next','right','下一张 →',pos===v.length-1||!v.length?'disabled':'')}</div>`}
function actions(){let p=current();return `<div class="actions"><div class="stars" role="group" aria-label="星级">${[1,2,3,4,5].map(n=>`<button data-rating="${n}" title="${n} 星 · 按 ${n}" aria-label="${n} 星" aria-pressed="${p?.rating===n}" class="${(p?.rating||0)>=n?'filled':''}" ${!p?'disabled':''}>${svg('star')}</button>`).join('')}</div><div class="flags"><button class="keep ${p?.flag==='keep'?'active':''}" aria-pressed="${p?.flag==='keep'}" data-action="keep" ${!p?'disabled':''}>${svg('flag')}留用 <kbd>C</kbd></button><button class="reject ${p?.flag==='reject'?'active':''}" aria-pressed="${p?.flag==='reject'}" data-action="reject" ${!p?'disabled':''}>${svg('cross')}排除 <kbd>X</kbd></button></div></div>`}
function tools(){return `<div class="tools">${btn('undo','undo','撤销 Ctrl+Z',!history.length?'disabled':'')}<button data-action="zoom" title="截图像素 100% / 适应 Z">${state.zoom?'适应':'100%'}</button>${btn('zen','fit','纯看图 Tab')}</div>`}
function film(){return `<div class="film" aria-label="照片缩略图">${visible().map(({p,i},n)=>`<button class="thumb ${i===state.index?'active':''}" data-photo="${i}" aria-label="查看 ${esc(p.name)}" aria-pressed="${i===state.index}"><img src="${p.src}" alt="" draggable="false"><span class="mono">${String(n+1).padStart(2,'0')}</span>${p.flag||p.rating?`<span class="mark">${p.flag==='keep'?'留':p.flag==='reject'?'×':''}${p.rating?' '+p.rating+'★':''}</span>`:''}</button>`).join('')}</div>`}
function fileInfo(){let p=current();return `<div class="file-info"><div class="label">109NZ5_2 / 审图</div><div class="filename">${p?esc(p.name):'没有符合筛选的照片'}</div><div class="path">${p?.demo?'用户截图 · 布局演示':'本地导入 · 仅浏览器内'}</div><div class="source">${p?.demo?(p.id===0?'主图取自原截图':'缩略图样张 · 非原片画质'):'适应窗口 · 保持原比例'}</div></div>`}
function side(full){return `<aside class="side"><div class="side-head"><div class="wordmark">filo<span style="color:var(--accent)">.</span></div><span class="label">PHOTO REVIEW</span>${btn('settings','settings','筛选与设置')}</div>${fileInfo()}${nav()}<div class="side-rule"></div>${actions()}<label class="auto">标记后自动前进<input type="checkbox" data-auto ${state.auto?'checked':''}></label>${tools()}${full?`<div class="side-rule"></div><section class="library"><div class="library-head"><span>照片序列 · ${visible().length}</span><div class="row">${btn('filter','filter','筛选照片')}${btn('film','grid','收起缩略图 T')}</div></div>${film()}</section>`:`<div class="side-rule"></div><div class="tools">${btn('film','grid','切换底片栏 T')}${btn('filter','filter','筛选照片')}${btn('upload','upload','导入本地照片')}</div><div class="small muted">← → 切换照片<br>1–5 星级 · 0 清空<br>Tab 纯看图</div>`}<div class="side-footer"><span><i class="save-dot"></i>仅原型内标记</span>${btn('settings','more','更多选项')}</div></aside>`}
function stage(){let p=current();return `<section class="stage ${state.zoom?'zoom':''}" aria-label="当前照片">${p?`<img class="photo" src="${p.src}" alt="${esc(p.name)}" draggable="false">${state.zoom?'<div class="zoom-note">100% 像素 · 拖动查看 · Z 返回适应</div>':''}`:`<div class="empty"><strong>没有匹配的照片</strong>试试标记几张照片，或清除筛选。<br><button class="border" data-action="clear-filter">显示全部</button></div>`}</section>`}
function render(){
 workspace.className=`workspace variant-${state.variant}${!state.film?' no-film':''}${state.zen?' zen':''}`;
 document.querySelectorAll('[data-variant]').forEach(b=>{b.classList.toggle('active',b.dataset.variant===state.variant);b.setAttribute('aria-pressed',b.dataset.variant===state.variant)});
 let content=stage();
 if(state.variant==='a')content+=side(true);
 if(state.variant==='b')content+=`<div class="topbar"><div class="wordmark">filo.</div><span class="sep"></span><span class="label">109NZ5_2 /</span><span class="filename">${esc(current()?.name||'无匹配照片')}</span><span class="grow"></span><span class="mode-label muted small">自由审图</span>${btn('filter','filter','筛选照片')}${btn('film','grid','切换底片栏 T')}${btn('settings','settings','审图设置')}</div><div class="bottom"><div class="actionline">${nav()}${actions()}${tools()}</div>${film()}</div>`;
 if(state.variant==='c')content+=`<div class="float-top"><div class="float-title"><span class="wordmark">filo.</span><span class="muted">/</span><span class="filename">${esc(current()?.name||'无匹配照片')}</span></div><div class="float-tools">${btn('film','grid','唤出底片栏 T')}${btn('settings','settings','筛选与设置')}${btn('zen','fit','纯看图 Tab')}</div></div>${state.film?`<div class="floating-strip">${film()}</div>`:''}<div class="float-dock">${nav()}${actions()}${tools()}</div>`;
 if(state.variant==='d')content+=`<aside class="left-wing"><div class="tools">${btn('film','grid','收起底片栏 T')}</div><span class="label">照片序列</span>${film()}<span class="label mono">${visible().length} 张</span></aside>${side(false)}`;
 workspace.innerHTML=content;
 const im=workspace.querySelector('.photo');if(im){im.addEventListener('load',measure,{once:true});im.addEventListener('error',()=>{workspace.querySelector('.stage').innerHTML='<div class="empty"><strong>图片无法显示</strong>请重新导入受支持的图片。</div>';document.querySelector('#coverage').textContent='—';document.querySelector('#gain').textContent='';},{once:true})}
 requestAnimationFrame(()=>{measure();centerThumb()});wake();
}
function centerThumb(){const t=workspace.querySelector('.thumb.active');if(!t)return;const f=t.parentElement;if(f.scrollHeight>f.clientHeight+5)f.scrollTop=t.offsetTop-f.offsetTop-f.clientHeight/2+t.clientHeight/2;else f.scrollLeft=t.offsetLeft-f.offsetLeft-f.clientWidth/2+t.clientWidth/2}
function measure(){let im=workspace.querySelector('.photo'),c=document.querySelector('#coverage'),g=document.querySelector('#gain');if(!im?.naturalWidth){c.textContent='—';g.textContent='';return}if(state.zoom){c.textContent='100%';g.textContent='像素查看';return}const stage=im.closest('.stage'),scale=Math.min(stage.clientWidth/im.naturalWidth,stage.clientHeight/im.naturalHeight);im.style.width=im.naturalWidth*scale+'px';im.style.height=im.naturalHeight*scale+'px';let r=im.getBoundingClientRect(),w=workspace.clientWidth,h=workspace.clientHeight,ratio=im.naturalWidth/im.naturalHeight,baseH=h*(1711/2088),baseW=Math.min(w,baseH*ratio);baseH=baseW/ratio;const pct=r.width*r.height/(w*h)*100,gain=(r.width*r.height/(baseW*baseH)-1)*100;c.textContent=pct.toFixed(1)+'%';g.textContent=`${gain>=0?'+':''}${gain.toFixed(0)}% 图片面积`;c.parentElement.title='完整图像矩形 ÷ 原型工作区；不计顶部方案导航。沉浸浮层遮挡未扣除。';g.title='相比原截图上下区域占比的同窗口估算，详见方案说明'}
function wake(){workspace.classList.remove('idle');clearTimeout(timer);if(state.variant==='c'&&!state.film&&!modal.open)timer=setTimeout(()=>{if(!workspace.querySelector('button:hover')&&!workspace.contains(document.activeElement))workspace.classList.add('idle')},2400)}
function toast(s){const t=document.querySelector('.toast');t.textContent=s;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1900)}
function navigate(d){clearTimeout(advanceTimer);const v=visible(),n=v.findIndex(x=>x.i===state.index)+d;if(v[n]){state.index=v[n].i;state.zoom=false;render()}}
function normalize(){const v=visible();if(!v.some(x=>x.i===state.index))state.index=v[0]?.i??-1}
function mark(key,value){const p=current();if(!p)return;clearTimeout(advanceTimer);const v=visible(),pos=v.findIndex(x=>x.i===state.index),next=v[pos+1]?.i;history.push({index:state.index,rating:p.rating,flag:p.flag});p[key]=p[key]===value?(key==='rating'?0:''):value;const title=p.name;normalize();render();toast(`${title} · ${key==='rating'?(p.rating?p.rating+' 星':'清除星级'):(p.flag==='keep'?'已留用':p.flag==='reject'?'已排除':'清除标记')}`);if(state.auto&&next!==undefined)advanceTimer=setTimeout(()=>{if(visible().some(x=>x.i===next)){state.index=next;state.zoom=false;render()}},450)}
function openModal(type){clearTimeout(advanceTimer);wake();if(type==='about')modal.innerHTML=`<div class="modal-head"><h2>把屏幕还给照片。</h2>${btn('close','cross','关闭')}</div><p>四种布局使用同一张照片，均按原比例完整显示。<strong style="color:var(--text)">推荐 A 作为默认审图，Tab 进入纯看图。</strong>先把操作挪进横向留白，再考虑隐藏控件。</p><table><thead><tr><th>方案</th><th>空间策略</th><th>适合 / 取舍</th></tr></thead><tbody><tr><td>A 侧边工作台</td><td>所有操作集中在右侧，画布全高</td><td>连续审图；控件易找、图片无遮挡</td></tr><tr><td>B 紧凑底片栏</td><td>单行顶部 + 薄底片，可按 T 收起</td><td>学习成本低；仍会占用纵向空间</td></tr><tr><td>C 沉浸浮层</td><td>画布铺满，2.4 秒闲置后隐藏浮层</td><td>看构图与细节；操作时可能遮住图片</td></tr><tr><td>D 双侧翼</td><td>左边选片、右边打分，中间全高</td><td>宽屏和竖片；窄屏时受可用宽度约束</td></tr></tbody></table><h3>为什么两边仍然会有留白？</h3><p>照片和屏幕的比例不同。要完整显示、保持比例，就必然存在留白；可把留白交给工具，但不能在不裁切的情况下把照片硬铺满屏幕。侧栏在较窄的窗口可能反而缩小图像，因此这里提供实时面积对比。</p><h3>数字如何计算</h3><p>图片占屏 = 实际图像矩形 ÷ 原型工作区。顶部方案导航不计入；“体验布局”隐藏导航。面积增幅以原截图应用区 3840 × 2088、上下共 377px 的占比，推算同窗口、同照片下的参照面积，不是生产应用的性能测量。C 的浮层遮挡未扣除，闲置隐藏后才是完整可见面积。</p><h3>试用方式</h3><div class="keylist"><span><kbd>← →</kbd> 上下张</span><span><kbd>1–5</kbd> 星级</span><span><kbd>C</kbd> 留用</span><span><kbd>X</kbd> 排除</span><span><kbd>U</kbd> 清除旗标</span><span><kbd>T</kbd> 底片栏</span><span><kbd>Tab</kbd> 纯看图</span><span><kbd>Z</kbd> 像素查看</span><span><kbd>Ctrl Z</kbd> 撤销</span></div><p>素材来自所提供截图。第一张是完整预览图，其余是低清缩略图，仅演示导航；可导入本地横图、竖图体验。标记仅在本页会话中保留，不修改任何原文件。</p><div class="modal-actions"><button class="primary" data-action="upload">${svg('upload')}导入自己的照片</button><button class="border" data-action="close">开始体验</button></div>`;
 else modal.innerHTML=`<div class="modal-head"><h2>${type==='tweaks'?'Tweaks · 布局微调':'Tweaks · 审图设置'}</h2>${btn('close','cross','关闭')}</div><div class="settings-grid"><label>筛选照片<select id="filter">${[['all','全部照片'],['unmarked','无旗标'],['keep','留用'],['reject','已排除'],['rated','3 星及以上']].map(([v,t])=>`<option value="${v}" ${state.filter===v?'selected':''}>${t}</option>`).join('')}</select></label><label>排序<select id="sort"><option value="asc" ${state.sort==='asc'?'selected':''}>默认顺序</option><option value="desc" ${state.sort==='desc'?'selected':''}>倒序</option></select></label><label>标记节奏<select id="auto"><option value="off" ${!state.auto?'selected':''}>手动前进</option><option value="on" ${state.auto?'selected':''}>标记后自动前进</option></select></label><label>界面<select id="film-option"><option value="show" ${state.film?'selected':''}>显示缩略图</option><option value="hide" ${!state.film?'selected':''}>隐藏缩略图</option></select></label><label>画布底色<select id="canvas-color"><option value="#151719">中性深灰</option><option value="#000000">纯黑</option><option value="#343638">中灰</option></select></label><label>侧栏缩略图尺寸<input id="thumb-size" type="range" min="48" max="110" value="${parseInt(getComputedStyle(document.documentElement).getPropertyValue('--thumb'))}" aria-label="缩略图尺寸"></label></div><div class="modal-actions"><button class="primary" data-action="upload">${svg('upload')}导入照片</button><button class="border" data-action="export">导出标记 JSON</button><button class="border" data-action="restore">恢复示例</button></div><p>支持 JPG / PNG / WebP / AVIF。仅本地预览，不上传。此原型不解码 RAW，截图中的 NEF 以预览图演示；导出的是审图标记清单。</p>`;
 if(!modal.open)modal.showModal();if(modal.querySelector('#canvas-color'))modal.querySelector('#canvas-color').value=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
}
const actionsMap={prev:()=>navigate(-1),next:()=>navigate(1),keep:()=>mark('flag','keep'),reject:()=>mark('flag','reject'),film:()=>{state.film=!state.film;render()},zoom:()=>{state.zoom=!state.zoom;render()},zen:()=>{state.zen=!state.zen;render();toast(state.zen?'纯看图 · 再按 Tab 恢复界面':'已恢复审图界面')},focus:()=>{document.body.classList.add('focus-mode');measure();toast('已隐藏方案导航 · Esc 返回')},exit:()=>{document.body.classList.remove('focus-mode');state.zen=false;render()},about:()=>openModal('about'),settings:()=>openModal('settings'),tweaks:()=>openModal('tweaks'),filter:()=>openModal('filter'),close:()=>modal.close(),upload:()=>document.querySelector('#upload').click(),'clear-filter':()=>{state.filter='all';normalize();render()},undo:()=>{clearTimeout(advanceTimer);let s=history.pop();if(s){Object.assign(photos[s.index],{rating:s.rating,flag:s.flag});state.index=s.index;normalize();render();toast('已撤销上一次标记')}},restore:()=>{photos=ASSETS.map((src,i)=>({id:i,src,name:i===0?'DSC_7949.NEF':`截图样张 ${String(i+1).padStart(2,'0')}`,rating:0,flag:'',demo:true}));history=[];state.index=0;state.filter='all';state.zoom=false;modal.close();render()},export:()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(photos.map(({name,rating,flag})=>({name,rating,flag})),null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='filo-review-marks.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('已导出标记清单')}};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(e.detail>0)b.blur();if(b.dataset.variant){clearTimeout(advanceTimer);state.variant=b.dataset.variant;state.zen=false;state.zoom=false;state.film=state.variant!=='c';render();return}if(b.dataset.photo){clearTimeout(advanceTimer);state.index=Number(b.dataset.photo);state.zoom=false;render();return}if(b.dataset.rating){mark('rating',Number(b.dataset.rating));return}if(actionsMap[b.dataset.action])actionsMap[b.dataset.action]()});
document.addEventListener('change',e=>{let t=e.target;if(t.matches('[data-auto]'))state.auto=t.checked;if(t.id==='filter'){state.filter=t.value;normalize();render()}if(t.id==='sort'){state.sort=t.value;render()}if(t.id==='auto'){state.auto=t.value==='on';render()}if(t.id==='film-option'){state.film=t.value==='show';render()}if(t.id==='canvas-color')document.documentElement.style.setProperty('--bg',t.value)});
document.addEventListener('input',e=>{if(e.target.id==='thumb-size')document.documentElement.style.setProperty('--thumb',e.target.value+'px')});
document.addEventListener('keydown',e=>{if(modal.open||e.target.matches('input,select,textarea'))return;if(e.key==='Escape'){actionsMap.exit();return}if(e.key==='Tab'&&e.target===document.body&&!e.shiftKey){e.preventDefault();actionsMap.zen();return}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();actionsMap.undo();return}if(e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.toLowerCase();if(k==='arrowleft'||k==='arrowright'){e.preventDefault();navigate(k==='arrowleft'?-1:1)}else if(/^[1-5]$/.test(k))mark('rating',Number(k));else if(k==='0'){if(current()?.rating)mark('rating',current().rating)}else if(k==='u'){if(current()?.flag)mark('flag',current().flag)}else if({c:'keep',x:'reject',t:'film',z:'zoom'}[k])actionsMap[{c:'keep',x:'reject',t:'film',z:'zoom'}[k]]()});
document.querySelector('#upload').addEventListener('change',async e=>{const files=[...e.target.files];if(!files.length)return;let loaded=[];for(const file of files){const src=URL.createObjectURL(file);try{await new Promise((res,rej)=>{const im=new Image();im.onload=res;im.onerror=rej;im.src=src});loaded.push({id:loaded.length,src,name:file.name,rating:0,flag:'',demo:false})}catch{URL.revokeObjectURL(src)}}if(loaded.length){photos.filter(p=>!p.demo).forEach(p=>URL.revokeObjectURL(p.src));photos=loaded;history=[];state.index=0;state.filter='all';state.zoom=false;modal.close();render();toast(`已导入 ${loaded.length} 张照片${loaded.length<files.length?'，部分格式无法显示':''}`)}else toast('无法显示所选图片，请选择 JPG、PNG、WebP 或 AVIF');e.target.value=''});
let drag=null;workspace.addEventListener('pointerdown',e=>{if(state.zoom&&e.target.matches('.photo')){const s=e.target.closest('.stage');drag={x:e.clientX,y:e.clientY,left:s.scrollLeft,top:s.scrollTop,s};s.classList.add('dragging');s.setPointerCapture(e.pointerId)}});workspace.addEventListener('pointermove',e=>{wake();if(drag){drag.s.scrollLeft=drag.left-(e.clientX-drag.x);drag.s.scrollTop=drag.top-(e.clientY-drag.y)}});workspace.addEventListener('pointerup',()=>{drag?.s.classList.remove('dragging');drag=null});workspace.addEventListener('pointercancel',()=>{drag=null});workspace.addEventListener('dblclick',e=>{if(e.target.matches('.photo'))actionsMap.zoom()});workspace.addEventListener('focusin',wake);workspace.addEventListener('focusout',wake);modal.addEventListener('close',wake);new ResizeObserver(measure).observe(workspace);render();
</script>

[workspace]
members = ["crates/*", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
storage-domain = { path = "crates/storage-domain" }
storage-provider-api = { path = "crates/storage-provider-api" }
provider-opendal = { path = "crates/provider-opendal" }
storage-repository = { path = "crates/storage-repository" }
storage-application = { path = "crates/storage-application" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
tokio = { version = "1", features = ["fs", "rt-multi-thread", "macros", "sync"] }
thiserror = "2"
tempfile = "3"
